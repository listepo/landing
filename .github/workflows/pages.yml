name: Deploy to GitHub Pages

# Astro build + docs and SEO checks, deployed to GitHub Pages through pyrlyn/infra's pages.yml.
on:
  push:
    branches: [main]
  # Pull requests run the build and the checks only; deploy stays main-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  pages:
    uses: pyrlyn/infra/.github/workflows/pages.yml@863d8960601216eec62d4aa78924f84ce61d72b9
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false
      node-version: "22"
      node-cache-dependency-path: package-lock.json
      setup-command: npm ci
      build-command: |
        export SITE_URL=https://listepo.github.io SITE_BASE=/landing/
        npm run build
        # docs coverage, headings and internal links
        npm run check:docs
        # SEO meta, headings, alt text, JSON-LD and sitemap
        npm run check:seo
      artifact-path: dist
      # A manual run deploys the branch it runs on (the github-pages environment's branch policy still applies).
      deploy-ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/main' }}
