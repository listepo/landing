name: Deploy to GitHub Pages

# Astro build + docs and SEO checks, deployed to GitHub Pages through pyrlyn/infra's pages.yml.
on:
  push:
    branches: [main]
  # Pull requests run the build and the checks only; deploy stays main-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  pages:
    uses: pyrlyn/infra/.github/workflows/pages.yml@0603d0ae610af9f792c5caf925041292a857e480
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mise: false
      node-version: "22"
      node-cache-dependency-path: package-lock.json
      setup-command: npm ci
      build-command: |
        export SITE_URL=https://pyrlyn.github.io SITE_BASE=/landing/
        npm run build
        # docs coverage, headings and internal links
        npm run check:docs
        # SEO meta, headings, alt text, JSON-LD and sitemap
        npm run check:seo
      artifact-path: dist
