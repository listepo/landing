name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests run the build and the docs check only; deploy stays main-only.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://pyrlyn.github.io
          SITE_BASE: /landing/
      - name: Check docs coverage, headings and internal links
        run: npm run check:docs
        env:
          SITE_BASE: /landing/
      - name: Check SEO meta, headings, alt text, JSON-LD and sitemap
        run: npm run check:seo
        env:
          SITE_URL: https://pyrlyn.github.io
          SITE_BASE: /landing/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
